# Builds the Android APK and the Windows and Linux installers, and publishes
# them to a GitHub Release when a tag is pushed.
#
# The trigger pattern is `v0.*` rather than `v*`, and that is deliberate, not
# an oversight: this project is beta (see the warning at the top of the
# README), and a `v1.0.0` tag is a claim this pipeline should not be able to
# make by accident. Staying on major version 0 is what tells that story in the
# version number itself - semver already treats 0.x as "still finding its
# shape" - so nothing needs a `-beta` suffix as well. When the project is
# ready to leave beta, widening this pattern is itself the decision to make,
# not something that should fall out of an unrelated tag.
#
# The order, and what stops what:
#
#       verify ── lint ──┬── android ──┐
#             └─ test ───┼── windows ──┼── publish
#                        └── linux ────┘
#
# **Nothing is built for a tag that does not pass.** The tag has to agree with
# the manifest, and lint and the full test suite have to pass, before the first
# installer is compiled. A release is the one build whose result people keep.
#
# **Nothing is published unless everything was built.** Each platform builds and
# uploads an *artifact*; only `publish`, which needs all of them, makes the
# release. Before this, each job published its own asset, so one failing left a
# release with an APK and no installer - a release that looks complete and is
# not. Now a failed build means no release at all, and the fix is the next tag.
name: Release

on:
  push:
    tags:
      - "v0.*"

# One release build at a time, across all tags: pushing a newer tag cancels the
# build of an older one still in flight. A release that has been superseded is
# not worth finishing, and the slow part (Rust cross-compiled per ABI, the
# installers) is exactly what is worth not paying for twice. Cancelling cannot
# leave a half-made release any more: nothing is published until `publish`.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: The tag has to agree with the manifest
        run: .github/tag-matches-manifest.sh

  lint:
    needs: verify
    uses: ./.github/workflows/lint.yml

  test:
    needs: verify
    uses: ./.github/workflows/test.yml

  android:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Gradle needs a JVM of its own; subosito/flutter-action only installs
      # the Flutter SDK. 17 matches what docs/building.md asks for locally.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The three ABIs the manual build instructions in docs/building.md target.
      # Rust compiles once per ABI; Cargokit invokes cargo-ndk during the Gradle
      # build, so nothing here calls it directly.
      - uses: ./.github/actions/setup
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # No prebuilt binary for this one - taiki-e/install-action does not
      # carry cargo-ndk - so this compiles from source. The cache keeps that to
      # the first run only.
      - run: cargo install cargo-ndk --locked

      # Neither the platform (`compileSdk = 37`) nor the NDK
      # (`ndkVersion = flutter.ndkVersion`) is installed by hand here - a
      # first attempt that named `platforms;android-37` explicitly failed
      # because the runner's sdkmanager repository does not carry that exact
      # package id under its default channel. Gradle already knows precisely
      # which platform and NDK side-by-side version it needs by reading those
      # two settings itself, and downloads whichever is missing the moment
      # licences are accepted - which is a more reliable source of truth than
      # this file guessing package ids by hand.
      - name: Accept the Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Decodes the same keystore `make keystore` writes locally, back into
      # the same place (android/) so android/app/build.gradle.kts's
      # ANDROID_KEYSTORE_PATH resolves it the same way it would resolve a
      # real key.properties. `make keystore-secrets` is what puts this and
      # the other three ANDROID_* secrets on the repo in the first place.
      #
      # Guarded on the secret being set at all, rather than assumed present:
      # a fork's build gets none of this repo's secrets, and should fall back
      # to the debug key exactly as build.gradle.kts does for a checkout with
      # no keystore, not fail the build outright. The check has to live in the
      # shell rather than an `if:` on this step - `secrets` is not a context
      # `if:` can read; only `env:` and `with:` can.
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/ddirc-release.jks
          fi

      # Generated Dart under lib/src/rust/ is committed, so this needs no
      # codegen toolchain - see "Building the Android app" in docs/building.md.
      #
      # `--build-name` is the tag with its leading `v` stripped, so the tag
      # `v0.1.0` becomes the version `0.1.0` shown to the user. `--build-number`
      # is the workflow run number rather than anything parsed from the tag:
      # Android's versionCode has to be a plain integer, and a run number is
      # already unique and increasing across every release this pipeline ever
      # makes.
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PATH: ddirc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}"
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/release/ddIRC-$VERSION.apk"

      # A release build is shrunk and renamed by R8, and a debug build is not, so
      # nothing that ran before this step has seen the program that ships. v0.12.0
      # to v0.12.3 shipped with R8 having renamed a class that the preferences
      # plugin is looked up by, and started on every phone with no saved networks
      # and every setting back at its default. This fails the release before it
      # is published; see android/check-release-apk.sh.
      - name: Check the APK survived R8
        run: bash android/check-release-apk.sh build/release/*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: build/release/*.apk
          if-no-files-found: error

  # The Windows installer: per-user, in %LOCALAPPDATA%, no administrator rights.
  #
  # `make installer` rather than the three commands it stands for, for the same
  # reason lint.yml and test.yml call their Makefile targets: one definition of
  # what a release build is, so what a maintainer builds locally and what
  # reaches a user cannot drift apart.
  windows:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      # `make` is not on a Windows runner; Inno Setup may or may not be, by the
      # image. `make` is what the rest of this project is driven by, and
      # installing it is cheaper than keeping a second description of the
      # release steps in this file.
      - name: Inno Setup and make
        shell: pwsh
        run: |
          choco install make --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      # Bash rather than PowerShell: the Makefile is a Unix makefile and its
      # ISCC detection is a shell pipeline. Git Bash is on the runner already.
      - name: Build the installer
        shell: bash
        run: make installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: build/installer/*.exe
          if-no-files-found: error

  # The Linux installer: one self-extracting script, per-user, into ~/.local.
  linux:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/linux-deps

      - name: Build the installer
        run: make installer-linux

      # What was built is tried before it is published: installed, upgraded and
      # removed in a throwaway home.
      - name: Install, upgrade and uninstall it
        run: make test-installer-linux INSTALLER="$(ls build/installer/*.sh)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: build/installer/*.sh
          if-no-files-found: error

  # The only job that writes to the repository, and the only one that can: it
  # needs every build, so it does not run if any of them did not finish.
  publish:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      # So a download can be checked against what was built, by anyone, with
      # nothing but `sha256sum -c`.
      - name: Checksums
        working-directory: release
        run: |
          # Written elsewhere first: a redirect into this directory would create
          # the file before the glob was expanded, and list it in itself.
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      # `prerelease: true` throughout: nothing this pipeline can tag is
      # anything else, per the trigger pattern above.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "ddIRC ${{ github.ref_name }} (beta)"
          prerelease: true
          body: |
            Beta build. See the warning at the top of the README before
            trusting this with anything that matters.

            | | |
            |---|---|
            | **Windows** | `ddIRC-*-windows-x64-setup.exe`. Installs for you only, into your own profile; no administrator rights. |
            | **Linux** | `ddIRC-*-linux-x64-installer.sh`. Run `sh` on it. Installs for you only, into `~/.local`; no root. `ddirc-uninstall` removes it. |
            | **Android** | `ddIRC-*.apk` |

            `SHA256SUMS` lists the checksum of each file.
          files: release/*
