# The test suites. Lint is a separate workflow, so a formatting slip and a
# broken test report as two different failures rather than one red tick.
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that needs no network and no Docker: the Dart widget tests and
  # the Rust unit and transcript tests. Fast, and it is the one that must never
  # be flaky, so it stands alone.
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-12
        with:
          toolchain: "1.99.1"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      # `flutter test` builds every dependency's native assets, and the tray
      # package (tray_manager 0.8, through cnativeapi) compiles against GTK 3,
      # X11 and Xi on Linux. Windows and Android do not need them, which is why
      # only this job does.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libx11-dev libxi-dev pkg-config

      - run: flutter pub get

      # The Makefile target, not the two commands it runs. Same reason `make
      # lint` is called rather than restated: a local check and CI cannot drift
      # apart if there is only one definition of what they do.
      - run: make test

  # The end-to-end suite, against a real ergo over real TLS.
  #
  # `make dev-server` rather than a `services:` block: the compose file already
  # describes the server, its healthcheck and its loopback binding, and a
  # service container would be a second description to keep in step. It also
  # puts the generated certificate in dev/ergo/ inside the workspace, which is
  # exactly where the tests look for it by default.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-12
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      # `--wait` blocks on the healthcheck, so the suite can start the instant
      # this returns.
      - run: make dev-server

      # Ergo generates its config and certificate as root inside the container.
      # The tests run as the runner user and only need to read the certificate.
      - run: sudo chmod -R a+rX dev/ergo

      - run: make test-integration

      # A timeout in these tests means the server did not say something the
      # client expected, and the server's own log is the only place that
      # reason exists.
      - if: failure()
        run: docker compose -f dev/compose.yaml logs --tail=200
