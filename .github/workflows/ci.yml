# The pipeline: what runs, in what order, and what stops what.
#
# Lint, Test and Build are workflows of their own so each can be read, run by
# hand and reused - and release.yml reuses them - but none of them starts on an
# event. This file does, and it decides the order:
#
#       changes ──┬── lint ──┐
#                 ├── test ──┴── build ── ci
#                 └── coverage ───────────┘
#
# **A pull request is never built until it passes lint and the tests.** Build is
# the slow one - Rust cross-compiled, a Windows installer, a Linux one - and a
# change that fails a formatter or a test would otherwise pay for all of it
# before anyone read the first red mark. Lint and test run side by side, so the
# wait for them is the longer of the two, not the sum.
#
# **Two exceptions, both about not paying for the build twice.** A pull request
# that changes only Dart under lib/ and test/ is not built at all: no platform
# toolchain reads those files, and the analyzer and the tests have already
# judged them. And `main` is always built, even after a failed test, because the
# build caches are saved only from there; see `build` and `changes` below.
#
# **Coverage runs beside them and gates nothing.** It is a measurement sent to
# Codecov, not a verdict, so `build` does not wait for it; `ci` does, so a run
# that could not measure is still seen.
#
# **A change that touches only documentation runs nothing.** `changes` reads
# which files changed; when every one is prose, the three jobs are skipped, and
# a skipped job counts as passing for a required check. (The workflow-level
# `paths-ignore` is not used for this: it would leave a required check waiting
# for ever on a change it skipped.)
#
# **`ci` is the one check to require.** It succeeds when everything that ran
# succeeded and when what was skipped was meant to be, and fails when anything
# failed or was cancelled. Branch protection can ask for it alone instead of a
# list of jobs that changes whenever a job is added.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already in flight. Nothing here is worth
# finishing twice, and the slow part is exactly what is worth not paying for
# twice. On `main` every push is kept, so a merge is never hidden by the next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.which.outputs.code }}
      native: ${{ steps.which.outputs.native }}
    steps:
      # Asked of the API rather than computed from a checkout: a pull request's
      # file list is one call, and nothing has to be fetched.
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          files=""
          if [ "$EVENT" = pull_request ]; then
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' || true)"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files="$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename' || true)"
          fi
          # Anything unknown is code: not being able to tell is not a reason to
          # skip the checks. Prose is Markdown, the licence, the issue forms and
          # Dependabot's own configuration.
          if [ -z "$files" ]; then
            { echo "code=true"; echo "native=true"; } >> "$GITHUB_OUTPUT"
            echo "no file list: running everything"; exit 0
          fi
          if printf '%s\n' "$files" | grep -Ev '(^docs/|\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/|^\.github/dependabot\.yml$)' | grep -q .; then
            code=true
          else
            code=false; echo "only documentation changed: nothing to run"
          fi

          # Whether a platform toolchain could be affected. The three builds are
          # the slow part of this pipeline and answer one question - do Gradle,
          # the NDK, the C++ runner and the installers still work - which a
          # change confined to Dart under lib/ and test/ cannot alter:
          # `flutter analyze` and the tests already judged that code.
          #
          # A list of what is SAFE to skip for, and not a list of what must
          # build. The first version of this named the things a build reads (the
          # platform folders, core/, the manifests...) and anything unnamed was
          # skipped, so a file nobody had thought of - a root `.cargo/config.toml`
          # with a target-specific linker setting, say - would have changed what
          # the Windows build does while the Windows build was skipped. Now a
          # file nobody has thought of builds. The only paths that do not are
          # Dart sources and tests, the tool scripts, and the prose `code` already
          # ignores; `lib/src/rust/` is the generated bridge, so it builds.
          #
          # `main` and a manual run always build, so a change that slipped
          # through is found one merge later, not at a release tag.
          native=false
          if [ "$code" = true ]; then
            safe='^(lib/|test/|tool/|docs/)|\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/|^\.github/dependabot\.yml$'
            if [ "$EVENT" != pull_request ]; then
              native=true
            elif printf '%s\n' "$files" | grep -Ev "$safe" | grep -q .; then
              native=true
            elif printf '%s\n' "$files" | grep -q '^lib/src/rust/'; then
              native=true
            else
              echo "Dart under lib/, test/ and tool/ only: the platform builds are skipped"
            fi
          fi
          { echo "code=$code"; echo "native=$native"; } >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/lint.yml

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test.yml

  # Beside lint and test, not before the build. `secrets: inherit` is what hands
  # the repository's CODECOV_TOKEN to the called workflow; without it the
  # upload would run tokenless and be refused on a protected branch.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  # On a pull request, only after lint and the tests both pass: if either fails
  # this is skipped, which is the whole point of the order. `!cancelled()` and
  # the explicit results replace the default "skip when a need failed" so that
  # `main` can differ.
  #
  # On `main` it runs whatever lint and the tests said. The caches the builds
  # restore - Rust per target, Gradle - are saved only by a run on `main` that
  # got as far as building, and a flaky integration test used to stop it, so a
  # red `main` left every pull request after it compiling the Rust core from
  # nothing. `ci` below still fails when lint or a test did, so a red `main` is
  # as visible as before; it just no longer costs the next pull request its
  # cache.
  #
  # And only when `native` says a build could tell something: see `changes`.
  build:
    needs: [changes, lint, test]
    if: >-
      !cancelled()
      && needs.changes.outputs.native == 'true'
      && (github.event_name != 'pull_request'
          || (needs.lint.result == 'success' && needs.test.result == 'success'))
    uses: ./.github/workflows/build.yml

  ci:
    if: always()
    needs: [changes, lint, test, coverage, build]
    runs-on: ubuntu-latest
    steps:
      # Skipped is fine - a documentation-only change skips all three - but a
      # failure or a cancellation is not. `contains` over the results rather
      # than a check per job, so a job added above is covered by adding it to
      # `needs`.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
