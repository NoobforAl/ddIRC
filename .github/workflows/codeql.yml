# Static analysis with CodeQL, for the two languages it can say something about.
#
# - rust: the core, which is where the network parsing, the TLS and the
#   credential handling live. `build-mode: none` reads the source directly, so
#   this needs no toolchain and no cross-compile — unlike build.yml.
# - actions: these workflow files themselves. release.yml holds the signing
#   secrets and a write token, and CodeQL's Actions queries are what catch an
#   untrusted `${{ }}` expanded into a shell or a permission wider than needed.
#
# Left out on purpose:
#
# - Dart, which CodeQL does not support at all. `make lint` (dart analyze) is
#   what covers lib/.
# - Kotlin and the C++ runner. Both would need a real Gradle and MSVC build
#   for CodeQL to trace — the slow half of build.yml all over again — to
#   analyse a few hundred lines that are mostly platform glue.
#
# Alerts inside `#[cfg(test)]` modules are dismissed by hand as "used in
# tests" rather than excluded here. CodeQL can only skip whole files
# (`paths-ignore`), and the tests live in the same files as the code they
# test, so excluding them would exclude the code too. A dismissal is kept
# across runs, so this is a one-time cost per finding.
#
# Every `uses:` in this and the other workflows is pinned to a commit rather
# than a tag, which a compromised action could move. Dependabot's
# github-actions entry is what moves the pins forward.
#
# Findings land in the repository's Security tab, not as a red tick: a new
# alert on a pull request shows up there and as a review annotation.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well, because the queries change even when the code does not.
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default suite plus the security-extended queries: more
          # findings, still almost all of them worth reading.
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
