# Does it still compile - and does it still install.
#
# A separate workflow from Test and Lint, and not folded into either, because
# it answers a question neither of them can. `make test` runs the Dart suite on
# the Dart VM and the Rust suite for the host; `make lint` runs analyze, format,
# rustfmt and clippy. Between them they never invoke a platform toolchain - so
# the Kotlin under `android/`, the C++ runner under `windows/`, the Gradle
# build, the NDK cross-compile, the Inno Setup script and the Linux installer
# are all invisible to them.
#
# That was not theoretical. The Android foreground service was rewritten across
# three Kotlin files and a new one, and every one of those changes could have
# failed to compile with both existing workflows green - the first build would
# have been the release tag, which is the worst possible moment to find out.
#
# The slow workflow, so it is the one ci.yml starts last: only for a change that
# has already passed lint and the tests. A change that fails either never pays
# for this. It is called by ci.yml, and never started by an event of its own.
#
# The two installers are built here as well as at release, from the same
# Makefile targets, and the Linux one is installed, upgraded and uninstalled in
# a throwaway home before anyone downloads it. Both are kept for a week as
# artifacts, so a pull request's installer can be tried without building it.
name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Kotlin, Gradle, and the Rust core cross-compiled for Android.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `cache: gradle` keeps the Gradle distribution, its wrapper and the
      # downloaded dependencies between runs - minutes of fetching otherwise.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # One ABI, not three: see `make build-android`. This asks whether it
      # compiles, and arm64 is the ABI the Rust cross-compile is the same code
      # for; the other two are built for real at release, where all three are
      # built and published.
      - uses: ./.github/actions/setup
        with:
          rust-targets: aarch64-linux-android

      - run: cargo install cargo-ndk --locked

      # Gradle reads compileSdk and ndkVersion itself and fetches what is
      # missing once the licences are accepted - see release.yml, where the
      # same step explains why nothing is named by package id here.
      - name: Accept the Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Debug, not release: this asks whether it compiles, and the release
      # build additionally signs.
      - run: make build-android ANDROID_TARGET=android-arm64

  # The C++ runner, the Rust core for windows-msvc, and the per-user installer.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # `make` is not on a Windows runner. Inno Setup may or may not be, by the
      # image; installing it only when it is absent saves the download on the
      # runs where it is already there.
      - name: Inno Setup and make
        shell: pwsh
        run: |
          choco install make --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      # The installer rather than the app, which builds the app on the way
      # through: `installer` depends on `build-release`. What it adds is the
      # Inno Setup script, which is otherwise only ever run by hand on one
      # maintainer's machine and would fail at the one moment it matters.
      - name: Build the installer
        shell: bash
        run: make installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: build/installer/*.exe
          if-no-files-found: error
          retention-days: 7

  # The Linux app, and the per-user installer around it - which, unlike the
  # Windows one, has never been run by anyone, and is tried here before it is
  # ever offered.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/linux-deps

      - name: Build the installer
        run: make installer-linux

      # Every library the program links against has to be on a plain Linux
      # desktop, or be inside the bundle. One that is neither would be a window
      # that never opens on someone else's machine.
      - name: Nothing the program links against is missing
        run: |
          missing="$(ldd build/linux/x64/release/bundle/ddirc | grep 'not found' || true)"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi

      # Install it, upgrade it, uninstall it, in a throwaway home. This is the
      # part nothing else tests.
      - name: Install, upgrade and uninstall it
        run: make test-installer-linux INSTALLER="$(ls build/installer/*.sh)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux
          path: build/installer/*.sh
          if-no-files-found: error
          retention-days: 7
