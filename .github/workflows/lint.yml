# Lint only. The suites run in test.yml, so a formatting slip and a broken
# test report as two different failures rather than one red tick.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run already in flight. Nothing here is worth
# finishing twice.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both toolchains are pinned rather than floating. `make lint` runs clippy
      # with `-D warnings`, so a lint newly added in a toolchain release would
      # fail CI on code that has not changed — which is the project's stated
      # posture for dependencies anyway.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-12
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The Cargo workspace is one level down.
          workspaces: core

      - run: flutter pub get

      # One target rather than three steps. The Makefile is the single source of
      # truth for what "clean" means — its own comment says this is what CI
      # should run — so a local check and CI cannot drift apart.
      - run: make lint
