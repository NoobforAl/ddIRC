# Lint only. The suites run in test.yml, so a formatting slip and a broken
# test report as two different failures rather than one red tick.
#
# Called by ci.yml (and release.yml), never started by an event of its own: what
# decides *when* anything runs, and in what order, is ci.yml, so that a build is
# never started for a change that does not pass this.
name: Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Both toolchains are pinned (see the setup action) rather than floating.
      # `make lint` runs clippy with `-D warnings`, so a lint newly added in a
      # toolchain release would fail CI on code that has not changed - which is
      # the project's stated posture for dependencies anyway.
      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt, clippy

      # One target rather than three steps. The Makefile is the single source of
      # truth for what "clean" means - its own comment says this is what CI
      # should run - so a local check and CI cannot drift apart.
      - run: make lint
