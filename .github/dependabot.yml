# Dependency updates, every second month.
#
# Often enough that nothing drifts a year behind, rarely enough that the
# pull requests are a batch to review rather than a stream to wave through.
# Each ecosystem arrives as one grouped PR, and CI (build, lint, test) runs on
# it like on any other.
#
# Some things are deliberately left out, because a bot would split what has to
# move together, or cannot do the work a bump needs:
#
# - flutter_rust_bridge: the Rust crate, the Dart package and the generated
#   bindings (`make codegen`) must be on the same version, bumped by hand.
# - rusqlite: capped by arti's tor-dirmgr, so it moves when arti does.
# - window_manager 0.6+: a breaking API change that needs the Windows title bar
#   rewritten and looked at, not just compiled.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 1 */2 *"
    open-pull-requests-limit: 3
    groups:
      dart:
        patterns: ["*"]
    ignore:
      - dependency-name: "flutter_rust_bridge"
      # 0.6 removes the `windowManager` global the Windows title bar uses; see
      # the note beside it in pubspec.yaml.
      - dependency-name: "window_manager"
        versions: [">=0.6.0"]

  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "cron"
      cronjob: "0 6 1 */2 *"
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
    ignore:
      - dependency-name: "flutter_rust_bridge"
      - dependency-name: "rusqlite"

  - package-ecosystem: "github-actions"
    # The workflows, and the composite actions under .github/actions, which pin
    # the toolchains: a pin in a file Dependabot does not read is one nobody
    # is told is stale.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "cron"
      cronjob: "0 6 1 */2 *"
    groups:
      actions:
        patterns: ["*"]
