# The system packages a Flutter Linux build and `flutter test` need.
#
# Written once because more than one job needs it and a package missing from one
# of them is a failure that only shows on that job. What each is for:
#
#   libgtk-3-dev, libx11-dev, libxi-dev   the GTK embedder; the tray package
#                                         (tray_manager 0.8, through cnativeapi)
#                                         compiles against GTK 3, X11 and Xi.
#                                         `flutter test` builds it too.
#   libsecret-1-dev, libjsoncpp-dev       flutter_secure_storage (the keychain)
#   libnotify-dev                         local_notifier (desktop notifications)
#   clang, cmake, ninja-build,            the Flutter Linux toolchain
#   liblzma-dev
#
# `flutter test` needs only the first group, so a test job asks for `build:
# false` and installs less. Installing is most of what this costs.
name: Linux build dependencies
description: apt packages for Flutter on Linux.

inputs:
  build:
    description: "'true' for the full set to build the Linux app; 'false' for what `flutter test` needs."
    default: "true"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BUILD: ${{ inputs.build }}
      run: |
        packages="pkg-config libgtk-3-dev libx11-dev libxi-dev"
        if [ "$BUILD" = "true" ]; then
          packages="$packages clang cmake ninja-build liblzma-dev libsecret-1-dev libjsoncpp-dev libnotify-dev"
        fi
        sudo apt-get update -qq
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends $packages
