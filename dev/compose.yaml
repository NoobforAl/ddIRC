# A throwaway IRC server, for development and tests.
#
# The client is TLS-only and verifies certificates — there is no
# `dangerously_accept_invalid_certs` path through ddirc-core — so a dev server
# has to speak real TLS rather than plaintext on 6667. Ergo's own entrypoint
# writes a config and generates a self-signed pair on first start; both land in
# `dev/ergo/` on the host, so a test can point a trust store at
# `dev/ergo/fullchain.pem` instead of weakening the client.
#
#   make dev-server        start it (first run generates config and certs)
#   make dev-server-stop   stop it, keeping accounts and certs
#   make dev-server-clean  stop it and throw the state away
#
# Two proxies live here too, both behind compose profiles so neither starts
# with `make dev-server`. They test different halves of the same setting:
#
#   make dev-proxy         a plain SOCKS5 proxy in front of this server
#   make dev-tor           real Tor, for the public networks
#
# Bound to loopback only. This server has a self-signed certificate and open
# account registration; it must never be reachable from anywhere else.

services:
  ircd:
    image: ghcr.io/ergochat/ergo:stable
    container_name: ddirc-dev-ircd
    restart: unless-stopped
    ports:
      - "127.0.0.1:6697:6697"
      # Published here rather than on the socks5 service, which shares this
      # container's network namespace and so cannot publish its own.
      - "127.0.0.1:1080:1080"
    volumes:
      # Config, certificates and the account datastore all live here, readable
      # from the host so tests can find the certificate.
      - ./ergo:/ircd
    healthcheck:
      # The TLS port accepting a connection is the thing tests actually wait on.
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 6697"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  # A plain SOCKS5 proxy sitting in front of the dev server.
  #
  # `network_mode: service:ircd` is the whole trick: this container shares the
  # ircd container's network namespace, so `127.0.0.1:6697` *inside the proxy*
  # is the dev server. The client can therefore ask the proxy for the same
  # `127.0.0.1:6697` it would have dialled directly, and the self-signed
  # certificate — issued for that name — still verifies. No second hostname, no
  # second certificate, and nothing about the client's TLS path changes.
  #
  # Offline and deterministic, which is what makes it the one to test against.
  # Tor cannot do this job: it will not route to a private address.
  #
  #   ddirc-cli --server 127.0.0.1 --port 6697 --proxy 127.0.0.1:1080 --nick x
  socks5:
    image: serjs/go-socks5-proxy@sha256:0af522996f402c03ecd985a87997158eabeb28935365e3a384df37eafcf740ea
    container_name: ddirc-dev-socks5
    profiles: ["proxy"]
    restart: unless-stopped
    network_mode: "service:ircd"
    depends_on:
      ircd:
        condition: service_healthy
    environment:
      # The image requires credentials unless told otherwise, and exits on
      # start when it has none — which compose reports as a healthy service,
      # because sharing another container's network namespace leaves nothing
      # here to health-check. `make dev-proxy` probes the port itself for
      # exactly that reason.
      REQUIRE_AUTH: "false"
      # Uncomment both, and drop REQUIRE_AUTH, to exercise RFC 1929 auth:
      # PROXY_USER: alice
      # PROXY_PASSWORD: hunter2

  # Real Tor, for the other half: a public network over the real thing.
  #
  # Built from Alpine rather than pulled from a third-party image — this is the
  # one container here whose entire job is privacy. Bootstrapping takes a
  # minute or so on a cold start; watch for "Bootstrapped 100%":
  #
  #   docker compose -f dev/compose.yaml logs -f tor
  #
  # It does two jobs at once. The SOCKS port is for public networks — not the
  # dev server, since Tor will not route to a private address and says so with
  # "Rejecting SOCKS request for anonymous connection". Reaching the dev server
  # over Tor takes the other job: it is also published as an onion service, so
  # there is a real onion address to test against without borrowing anyone
  # else's. `make dev-tor` prints it.
  tor:
    build: ./tor
    image: ddirc-dev-tor
    container_name: ddirc-dev-tor
    profiles: ["tor"]
    restart: unless-stopped
    depends_on:
      # The onion service forwards to this container by name, so Tor needs it
      # resolvable before it starts.
      ircd:
        condition: service_healthy
    ports:
      - "127.0.0.1:9050:9050"
    volumes:
      # Kept, so a restart reuses the consensus instead of bootstrapping from
      # nothing again. A named volume rather than a host directory, because a
      # bind mount arrives owned by root and Tor drops to its own user, which
      # it then refuses to start without.
      - tor-state:/var/lib/tor
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9050"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s

  # A throwaway XMPP server, for the other protocol. Behind its own profile, so
  # it does not start with the IRC one:
  #
  #   make dev-xmpp          start it, with alice and bob registered
  #   make dev-xmpp-stop     stop it
  #
  # ejabberd rather than Prosody: Prosody's Docker image has not been updated
  # since 2021 and is version 0.11, which lacks stream management and the
  # direct-TLS option. ejabberd's official image is current, and its stock
  # config is what is wanted here - direct TLS on 5223, multi-user chat with
  # server-side history, carbons, stream management, HTTP upload - so the only
  # thing mounted is the certificate. That is also why there is no config in
  # this directory to keep in step with a server that changes.
  #
  # Only 5223 is published, and only on loopback. The container also listens on
  # 5222 (STARTTLS) and others inside, unreachable from the host and unused by
  # the client, which has no STARTTLS in it. Open registration and a
  # self-signed certificate must never be reachable from anywhere else.
  xmppd:
    image: ghcr.io/processone/ejabberd@sha256:ec5cf7bc85627fd9bde47309a34600d6c16895e9808807ec9ff57426f2508115
    container_name: ddirc-dev-xmppd
    profiles: ["xmpp"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5223:5223"
      # File upload (XEP-0363). The slot the server hands out points here, and the
      # client uploads to it over HTTPS on its own connection, not over 5223.
      - "127.0.0.1:5443:5443"
    # ejabberd listens for its control commands on a Unix socket, and first puts a
    # provisional one under /opt/ejabberd/sockets whose name is base64 of a value
    # derived from its random Erlang cookie. Base64 can contain a "/", so the
    # name is often a directory and a file, and ejabberd makes only the directory
    # level (`make_dir`, not `make_dirs`) - which fails with `enoent`, and the
    # server does not start, if /opt/ejabberd/sockets is not already there. It is
    # not in the image. So a first start fails about as often as the cookie
    # produces a "/", and a machine with a restart policy retries until one does
    # not: that is how this worked on a laptop and failed on a fresh CI runner,
    # where `up --wait` gave up on the first unhealthy start. A tmpfs makes the
    # directory exist, owned by the server, whatever the cookie says.
    tmpfs:
      - /opt/ejabberd/sockets:uid=9000,gid=9000,mode=0700
    volumes:
      # Made by xmpp/gen-certs.sh before the first start. The tests trust the
      # sibling localhost.crt directly.
      - ./xmpp/certs/server.pem:/opt/ejabberd/conf/server.pem:ro
    healthcheck:
      test: ["CMD", "/opt/ejabberd/bin/ejabberdctl", "status"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  # Removed by `make dev-server-clean`, along with everything else here.
  tor-state:
