[workspace]
resolver = "2"
members = ["ddirc-core", "ddirc-cli", "ddirc-bridge", "ddirc-server", "ddirc-tor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# `ctcp` is deliberately NOT enabled, and adding it would be a privacy
# regression rather than a feature. The name suggests it is what lets a client
# understand CTCP; what it actually does is make the crate *answer* CTCP by
# itself, from inside `ClientStream::poll_next`, before any of our code sees the
# message. With it on, anyone on the network can send a `PRIVMSG` and get back
# the real name and username (`FINGER`), the crate's version string
# (`VERSION`), and — worst of the set — `Local::now()` formatted as RFC 2822
# (`TIME`), which discloses the wall clock and the UTC offset of the machine
# the client is running on. That is a location down to the hour, handed out on
# request, and `SECURITY.md` promises the opposite.
#
# Nothing here needs it. `ACTION` is built and parsed by us
# (`conn::actor::queue` and `on_ctcp`), and so is `DCC SEND`; the crate's
# CTCP-gated senders are never called. With the feature off, the crate's
# `handle_ctcp` compiles to a stub that returns `Ok(())`, which is the
# behaviour that was always intended.
irc = { version = "1.1.0", default-features = false, features = ["tls-rust", "channel-lists", "proxy"] }
tokio = { version = "1", default-features = false }
futures-util = "0.3"
thiserror = "2"
# Matched on directly in conn/diagnose.rs. The irc crate pulls it in for the
# "proxy" feature but does not re-export it, and its Display strings on their
# own do not say what to do about a proxy that will not carry a connection.
tokio-socks = "0.5.1"
# The local server's half of the protocol. Already in the tree underneath the
# `irc` client crate, so depending on it directly adds nothing to the build.
irc-proto = { version = "1.1.0", default-features = false, features = ["tokio"] }
tokio-util = "0.7"
# rustls and tokio-rustls arrive with the `irc` crate's "tls-rust" feature, so
# the server side of TLS costs nothing new.
#
# The crypto provider must be the one the rest of the tree already uses, and it
# is aws-lc-rs — tokio-rustls turns it on by default, and `irc` takes
# tokio-rustls with its defaults. Naming a different one here would not give
# this crate a second provider; Cargo unifies features, so it would switch
# *both* on across the whole build, and rustls 0.23 answers "both" with a panic
# at the first handshake rather than an error at build time. The client would
# stop connecting to anything, for a change made only to the server.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26" }
# The one genuinely new dependency, and the only part of the local server that
# was not already here. See `identity.rs` for why it is not hand-rolled.
rcgen = "0.14"
# Tor, embedded. The version is pinned to a minor because arti's own crates
# move together and mixing them is not supported.
arti-client = { version = "0.45.0", default-features = false, features = [
    "tokio",
    "rustls",
    "static-sqlite",
    "compression",
    "flowctl-cc",
    "onion-service-client",
] }
tor-rtcompat = { version = "0.45.0", default-features = false, features = ["tokio", "rustls"] }
tracing = "0.1"
flutter_rust_bridge = "=2.13.0"
zeroize = { version = "1", features = ["derive"] }

# A one-condition fix to `saturating-time`, until upstream carries it.
#
# 0.4.0's search for the minimum representable `SystemTime` never terminates on
# Windows: the clock counts 100-nanosecond intervals, so a finer probe succeeds
# without moving, the step never halves again, and the loop spins on one core
# forever. `tor-netdoc` reaches it while date-checking a consensus, which is
# exactly why bundled Tor never finished bootstrapping. See
# `vendor/saturating-time/src/internal.rs` for the argument, and TODO.md item 1
# for how it was found.
#
# Vendored rather than forked: 546 lines, no dependencies, MIT OR Apache-2.0.
# Delete the directory and this block together when a fixed release exists.
[patch.crates-io]
saturating-time = { path = "vendor/saturating-time" }

# ---------------------------------------------------------------------------
# How the native core is built.
#
# Cargo's defaults are aimed at a library being developed, not at an app being
# run on a phone, and the gap shows most on the hardware that can least afford
# it. Both profiles below are about one thing: the core does TLS, compression
# and protocol parsing on every connection, and none of that is work the device
# should be doing at a debug build's speed.

[profile.release]
opt-level = 3
# Thin rather than fat. Fat LTO is a single-threaded link over 507 crates,
# which on this tree costs more build time than the last few percent is worth;
# thin still inlines across crate boundaries, which is where the parsing and
# TLS paths lose out without it.
lto = "thin"
# One unit per crate. The default of sixteen exists to parallelise the build,
# and it pays for that by handing the optimiser sixteen partial views of the
# same crate instead of one whole one.
codegen-units = 1
strip = "symbols"
# Deliberately NOT `panic = "abort"`, tempting as the size saving is.
# flutter_rust_bridge turns a panic inside a bridged call into a Dart exception
# by catching the unwind. Aborting would turn every one of those into a crash
# of the whole app.
panic = "unwind"

# Dependencies optimised even in a debug build; our own crates left alone.
#
# A debug `aws-lc-rs` is not slightly slower than a release one, it is slower by
# more than an order of magnitude — enough that the TLS handshake becomes the
# thing you are waiting for on an older phone, and enough to make `flutter run`
# look like the app is broken rather than unoptimised. Nothing in this list is
# what anyone is debugging, so there is nothing to lose by optimising it.
[profile.dev.package."*"]
opt-level = 2
