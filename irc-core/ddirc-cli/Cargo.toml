[package]
name = "ddirc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI test harness that exercises ddirc-core without Flutter."

[dependencies]
ddirc-core = { path = "../ddirc-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
