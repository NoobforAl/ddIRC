// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.ddirc_bridge'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.ddirc_bridge'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Matches `minSdk` in android/app/build.gradle.kts, which carries the
        // reasoning for 29. It has to be set here too and not only there:
        // cargokit reads this module's value (plugin.gradle) to pick the NDK
        // API level the Rust library is compiled against, so leaving 19 would
        // build the native half for a platform the Kotlin half refuses to
        // install on.
        minSdkVersion 29
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../irc-core/ddirc-bridge"
    libname = "ddirc_bridge"
}
