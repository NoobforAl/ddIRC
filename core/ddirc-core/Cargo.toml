[package]
name = "ddirc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reusable chat client core for ddIRC: IRC and XMPP (connection, TLS, protocol, state)."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
irc.workspace = true
# `net`, `io-util` and `fs` are for DCC transfers: their own sockets, and
# streaming a file to or from one without holding it all in memory.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
futures-util.workspace = true
thiserror.workspace = true
tokio-socks.workspace = true
tracing.workspace = true
base64 = "0.23"
rand = "0.10"
rusqlite.workspace = true
zeroize.workspace = true
tokio-xmpp.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
rustls-native-certs.workspace = true
sasl.workspace = true

[dev-dependencies]
# A throwaway CA and leaf, to run the XMPP connector against a real TLS server.
rcgen.workspace = true
# To read what tokio-xmpp says about itself while a test runs; already in the
# tree underneath it.
log = "0.4"
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
